name: Offline lab regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source without persisting credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, reviewed 2026-10-10
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, reviewed 2026-10-10
        with:
          python-version: '3.12'
      - name: Run dependency-free unit and loopback HTTP tests
        env:
          RUN_LOCAL_HTTP_TESTS: '1'
        run: python -m unittest discover -s tests -v
