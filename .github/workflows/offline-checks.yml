name: Offline lab regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source without persisting credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, reviewed 2026-10-10
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, reviewed 2026-10-10
        with:
          python-version: '3.12'
      - name: Run dependency-free unit and loopback HTTP tests
        env:
          RUN_LOCAL_HTTP_TESTS: '1'
        run: python -m unittest discover -s tests -v
